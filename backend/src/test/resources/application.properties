# ==========================================
# TEST DATABASE - H2
# ==========================================

spring.datasource.url=jdbc:h2:mem:pulsedrive_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false


# ==========================================
# JWT TEST CONFIG
# ==========================================

jwt.secret=PulseDriveTestJwtSecretKey2026SecureTesting12345678901234567890
jwt.expiration=86400000


# ==========================================
# RAZORPAY TEST CONFIG
# ==========================================

razorpay.key.id=rzp_test_dummy_key
razorpay.key.secret=dummy_razorpay_secret


# ==========================================
# EMAIL TEST CONFIG
# ==========================================

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.com
spring.mail.password=dummy-test-password

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false